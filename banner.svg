<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b2a"/>
      <stop offset="0.55" stop-color="#1b1350"/>
      <stop offset="1" stop-color="#2a1a5e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.35" r="0.4">
      <stop offset="0" stop-color="#ff7ad9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff7ad9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bell" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffd1f2" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ff7ad9" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#b84dff" stop-opacity="0.55"/>
    </radialGradient>
    <style>
      .t1 { fill: #f3ecff; font-size: 40px; font-weight: 700; }
      .t2 { fill: #ffb3ec; font-size: 19px; font-weight: 500; }
      .t3 { fill: #a99bd6; font-size: 14px; letter-spacing: 1.5px; }
      .ax { fill: #a99bd6; font-size: 12px; }
      .tag { fill: #0a0b2a; font-size: 13px; font-weight: 700; }
      .jelly { animation: bob 4s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      .ten { stroke-dasharray: 4 5; animation: flow 2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -18; } }
      .bub { animation: rise 7s linear infinite; }
      @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.7; } 100% { transform: translateY(-260px); opacity: 0; } }
      .bar { animation: grow 3s ease-in-out infinite alternate; transform-origin: bottom; transform-box: fill-box; }
      @keyframes grow { from { transform: scaleY(0.85); } to { transform: scaleY(1); } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- bubbles -->
  <g fill="#ffffff">
    <circle class="bub" cx="560" cy="300" r="3" style="animation-delay:0s"/>
    <circle class="bub" cx="610" cy="310" r="2" style="animation-delay:2.2s"/>
    <circle class="bub" cx="1150" cy="305" r="2.5" style="animation-delay:1.1s"/>
    <circle class="bub" cx="120" cy="310" r="2" style="animation-delay:3.6s"/>
    <circle class="bub" cx="1010" cy="300" r="2" style="animation-delay:5s"/>
  </g>

  <!-- title -->
  <text x="48" y="92" class="t3">PART 3 · COMPARATIVE AGEING GENOMICS</text>
  <text x="48" y="142" class="t1">Jellyfish → Human</text>
  <text x="48" y="178" class="t2">Do the immortal jellyfish's genes fade with age in us?</text>

  <g transform="translate(48,208)">
    <rect width="104" height="30" rx="15" fill="#ff7ad9"/>
    <text x="52" y="20" text-anchor="middle" class="tag">22 genes</text>
    <rect x="116" width="200" height="30" rx="15" fill="#b9a6ff"/>
    <text x="216" y="20" text-anchor="middle" class="tag">46 tissues · 971 donors</text>
    <rect x="328" width="196" height="30" rx="15" fill="#7ce0d3"/>
    <text x="426" y="20" text-anchor="middle" class="tag">Answer: no age signal</text>
  </g>

  <!-- null distribution panel -->
  <g transform="translate(640,58)">
    <rect width="360" height="190" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#b9a6ff" stroke-opacity="0.3"/>
    <line x1="30" y1="155" x2="340" y2="155" stroke="#a99bd6"/>
    <g fill="#b9a6ff" fill-opacity="0.55">
      <rect class="bar" x="60" y="145" width="18" height="10"/>
      <rect class="bar" x="82" y="132" width="18" height="23"/>
      <rect class="bar" x="104" y="112" width="18" height="43"/>
      <rect class="bar" x="126" y="88" width="18" height="67"/>
      <rect class="bar" x="148" y="64" width="18" height="91"/>
      <rect class="bar" x="170" y="52" width="18" height="103"/>
      <rect class="bar" x="192" y="62" width="18" height="93"/>
      <rect class="bar" x="214" y="86" width="18" height="69"/>
      <rect class="bar" x="236" y="110" width="18" height="45"/>
      <rect class="bar" x="258" y="130" width="18" height="25"/>
      <rect class="bar" x="280" y="144" width="18" height="11"/>
    </g>
    <line x1="176" y1="34" x2="176" y2="155" stroke="#ff7ad9" stroke-width="3"/>
    <text x="182" y="44" class="ax" fill="#ffb3ec" style="fill:#ffb3ec">jellyfish set</text>
    <text x="30" y="176" class="ax">10,000 random gene sets</text>
    <text x="340" y="176" class="ax" text-anchor="end">p = 0.72</text>
  </g>

  <!-- jellyfish -->
  <g transform="translate(1100,110)"><g class="jelly">
    <path d="M-52,0 C-52,-48 52,-48 52,0 C40,8 28,2 17,8 C6,2 -6,2 -17,8 C-28,2 -40,8 -52,0 Z" fill="url(#bell)"/>
    <ellipse cx="-16" cy="-22" rx="9" ry="5" fill="#ffffff" opacity="0.45"/>
    <g stroke="#ff9be6" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.85">
      <path class="ten" d="M-38,6 C-44,40 -30,70 -40,110"/>
      <path class="ten" d="M-18,8 C-24,46 -10,80 -20,128"/>
      <path class="ten" d="M0,8 C-6,50 8,86 -2,140"/>
      <path class="ten" d="M18,8 C12,46 26,80 16,128"/>
      <path class="ten" d="M38,6 C32,40 46,70 36,110"/>
    </g>
  </g></g>
</svg>
